%YAML 1.2
---
$id: http://devicetree.org/schemas/media/amlogic,gx-vdec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic Video Decoder

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Christian Hewitt <christianshewitt@gmail.com>
  - Gus Bourg <gus@bourg.net>

description: |
  The video decoding IP lies within the DOS memory region,
  except for the hardware bitstream parser that makes use of an undocumented
  region.

  It makes use of the following blocks:
  - ESPARSER is a bitstream parser that outputs to a VIFIFO. Further VDEC blocks
    then feed from this VIFIFO.
  - VDEC_1 can decode MPEG-1, MPEG-2, MPEG-4 part 2, MJPEG, H.263, H.264, VC-1.
  - VDEC_HEVC can decode HEVC, and VP9 on GXL, GXM, G12A and SM1.

  Both VDEC_1 and VDEC_HEVC share the "vdec" IRQ and as such cannot run
  concurrently.

  S4 has no ESPARSER: the decoder fetches the bitstream from memory directly,
  and the VDEC_1 and VDEC_HEVC power domains are switched by the secure
  monitor.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - amlogic,gxbb-vdec # GXBB (S905)
              - amlogic,gxl-vdec # GXL (S905D, S905W, S905X, S905Y)
              - amlogic,gxlx-vdec # GXLX (S905L)
              - amlogic,gxm-vdec # GXM (S912)
          - const: amlogic,gx-vdec
      - enum:
          - amlogic,g12a-vdec # G12A (S905X2, S905D2)
          - amlogic,sm1-vdec # SM1 (S905X3, S905D3)
          - amlogic,s4-vdec # S4 (S805X2, S905Y4)

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    items:
      - const: vdec
      - const: esparser

  reg:
    maxItems: 2

  reg-names:
    items:
      - const: dos
      - enum: [ esparser, dmc ]

  resets:
    minItems: 1
    maxItems: 3

  reset-names:
    minItems: 1
    maxItems: 3

  clocks:
    minItems: 3
    maxItems: 5

  clock-names:
    minItems: 3
    maxItems: 5

  power-domains:
    maxItems: 2

  power-domain-names:
    items:
      - const: vdec
      - const: hevc

  amlogic,ao-sysctrl:
    description: should point to the AOBUS sysctrl node
    $ref: /schemas/types.yaml#/definitions/phandle

  amlogic,canvas:
    description: should point to a canvas provider node
    $ref: /schemas/types.yaml#/definitions/phandle

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,gx-vdec

    then:
      properties:
        clock-names:
          items:
            - const: dos_parser
            - const: dos
            - const: vdec_1
            - const: vdec_hevc

  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,g12a-vdec
              - amlogic,sm1-vdec

    then:
      properties:
        clock-names:
          items:
            - const: dos_parser
            - const: dos
            - const: vdec_1
            - const: vdec_hevc
            - const: vdec_hevcf

  - if:
      properties:
        compatible:
          contains:
            const: amlogic,s4-vdec

    then:
      properties:
        interrupts:
          maxItems: 1
        reg-names:
          items:
            - const: dos
            - const: dmc
        clock-names:
          items:
            - const: dos
            - const: vdec_1
            - const: vdec_hevc
        resets:
          items:
            - description: HEVC front pipeline 0
            - description: HEVC front pipeline 1
            - description: HEVC back pipeline 1
        reset-names:
          items:
            - const: hevcf-pipl0
            - const: hevcf-pipl1
            - const: hevcb-pipl1
        amlogic,ao-sysctrl: false
      required:
        - power-domains
        - power-domain-names

    else:
      properties:
        interrupts:
          minItems: 2
        reg:
          minItems: 2
        reg-names:
          items:
            - const: dos
            - const: esparser
        resets:
          maxItems: 1
        reset-names:
          items:
            - const: esparser
        power-domains: false
        power-domain-names: false
      required:
        - resets
        - reset-names
        - amlogic,ao-sysctrl

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - amlogic,canvas

additionalProperties: false

examples:
  - |
    vdec: video-decoder@c8820000 {
          compatible = "amlogic,gxl-vdec", "amlogic,gx-vdec";
          reg = <0xc8820000 0x10000>, <0xc110a580 0xe4>;
          reg-names = "dos", "esparser";
          interrupts = <44>, <32>;
          interrupt-names = "vdec", "esparser";
          clocks = <&clk_dos_parser> ,<&clk_dos>, <&clk_vdec_1>, <&clk_vdec_hevc>;
          clock-names = "dos_parser", "dos", "vdec_1", "vdec_hevc";
          resets = <&reset_parser>;
          reset-names = "esparser";
          amlogic,ao-sysctrl = <&sysctrl_AO>;
          amlogic,canvas = <&canvas>;
    };
